[user]
description = "A chill guy. Talk to me as if I was a chill turtle."
# optionnal:
prompt_context = "system is nixos on asahi linux (m1 max macbook pro, aarch64)"

# to provide the prompt, the user can either pipe in the prompt, or set these two variables
# prompt = "Make KSA run."
prompt = "Please get KSA running, you can use FEX (its name is fex but the bin's name is FEX, all caps), muvm, and request whatever else you need. it does not launch since there is an architecture mismatch: i am on aarch64, ksa is built for x86_64. fex is a fast usermode x86 and x86-64 emulator for Arm64 Linux, and muvm can run 4k page programs on a system with 16k pages like mine. "
# and set this to true
use_toml_prompt = true

[general]
# main_model = "gemma4:e2b"
main_model = "granite4.2:3b"
assistant_model = "gemma4:e2b"
decision_model = "tev1:0.8b"
think = true

[model_config]
max_tokens_size = 16384
# max_tokens_size = 65536
# fixed for now, will eventually become variable depending on task.
max_steps = 10
max_misses = 3

[tools_config]
# max duration in seconds of a script before aborting automatically
script_timeout = 30


[model_prompts]
welcome = """You are an agent, do what the user asks or, if the prompt is a question, answer them.
You can experiment, and mess around as much as you want. Do not be worried about breakage of the outside, you are in a sandbox.
If you have made progress, you can back up certain files into /backup before doing anything that could destroy progress."""
world_context = """You can use run_script to interact with your environment through a bash shell.
/workspace is writeable, and is where you should do the bulk of your work.
/tmp is temporary and writeable, you can mess around in it to test things, but any work that is permanent must be made in /workspace.
/prompt is where the user puts their files if they want you to interact with them. /prompt is read-only; if you want to do anything with your files,
it is recommended to copy them into /workspace.
/backup is writeable, but do not do any work in it. It is only available for you in case there is something you want to do, will permanently alter files,
and you want to backup the files' previous state just in case.
Nothing that you say will be accessible to the user; instead, provide your answers or requests through the tools available.
If you do not have commands that are necessary to finish the task, you can ask for them with the request tool.
You are expected to work out tools by yourself.
Never ask the user how a command works. Instead:
1. Run `<cmd> --help`, `man <cmd>`, or `which <cmd>` and read the output.
2. Look in `/nix/store/*fex*/share/doc` and the project's GitHub README via curl if the network is allowed.
3. Try the command, read the error, adjust, retry.
Only ask the user when you need a decision (e.g. which game) or hit a permission you don't have.
"""


[logs]
log_output = true
log_thoughts = true
